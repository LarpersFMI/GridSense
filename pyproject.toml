[project]
name = "gridsense"
version = "0.1.0"
description = "Zero-cost hours agent for PPC Energie (Smarthack XI 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.45",
    "entsoe-py>=0.6",
    "requests>=2.31",
    "holidays>=0.50",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "streamlit>=1.35",
    "plotly>=5.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridsense"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
