services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: gridsense
            POSTGRES_PASSWORD: gridsense
            POSTGRES_DB: gridsense
        ports:
            - "5432:5432"
        volumes:
            - postgres:/var/lib/postgresql/data

    redis:
        image: redis:7
        ports:
            - "6379:6379"

volumes:
    postgres:
