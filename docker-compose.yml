services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: gridsense
            POSTGRES_PASSWORD: gridsense
            POSTGRES_DB: gridsense
        ports:
            - "5432:5432"
        volumes:
            - postgres:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U gridsense -d gridsense"]
            interval: 2s
            timeout: 5s
            retries: 30

    redis:
        image: redis:7
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 2s
            timeout: 5s
            retries: 30

volumes:
    postgres:
